databases:
  - name: done-db
    plan: free
    databaseName: done
    user: done

services:
  - type: web
    name: done-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma db push --accept-data-loss
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: done-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: done-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: cron
    name: done-followup-cron
    runtime: node
    plan: free
    rootDir: server
    schedule: "0 12 * * *" # 12:00 UTC = 09:00 no horário de Brasília
    buildCommand: npm install && npx prisma generate
    startCommand: node src/jobs/followUp.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: done-db
          property: connectionString
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
